services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: finanzas
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    ports:
      - '8081:8080'
    depends_on:
      - postgres

  transactions-service:
    build: ./transactions-service
    ports:
      - '8082:8080'
    depends_on:
      - postgres

  budget-service:
    build: ./budget-service
    ports:
      - '8083:8080'
    depends_on:
      - postgres

volumes:
  postgres-data:
